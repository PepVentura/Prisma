<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisma · Spotify</title><meta name="robots" content="noindex">
<style>
body{font:18px system-ui,sans-serif;max-width:680px;margin:60px auto;padding:0 20px;background:#07090d;color:#e9eff4;line-height:1.5}
#codigo{width:100%;box-sizing:border-box;font:16px monospace;padding:12px;background:#0f141b;color:#e9eff4;border:1px solid #1d2631;border-radius:10px;word-break:break-all}
button{font:600 18px system-ui;padding:10px 22px;border:0;border-radius:22px;background:#22d3ee;color:#07090d;margin-top:12px}
.tenue{color:#7f8c98}
</style></head><body>
<h2 id="titulo">Prisma · Spotify</h2>
<div id="ok" hidden>
  <p>Copia este código y pégalo en la página de Prisma que tienes abierta (o en la terminal):</p>
  <textarea id="codigo" rows="4" readonly></textarea>
  <button id="copiar">Copiar</button> <span id="copiado" class="tenue"></span>
  <p class="tenue">Caduca en unos minutos. Este código no sale de tu navegador: esta página no lo envía a ningún sitio.</p>
</div>
<p id="mal" hidden></p>
<script>
const q = new URLSearchParams(location.search);
if (q.get("code")) {
  document.getElementById("ok").hidden = false;
  const c = document.getElementById("codigo"); c.value = q.get("code"); c.select();
  document.getElementById("copiar").onclick = async () => {
    try { await navigator.clipboard.writeText(c.value); } catch (e) { c.select(); document.execCommand("copy"); }
    document.getElementById("copiado").textContent = "Copiado";
  };
} else {
  const m = document.getElementById("mal"); m.hidden = false;
  m.textContent = q.get("error") ? "Spotify no ha dado permiso (" + q.get("error") + ")." : "Esta página recoge el código de conexión de Spotify para Prisma.";
}
</script>
</body></html>
