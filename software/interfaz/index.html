<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisma</title>
<style>
/* Pantalla de 1024 × 600, siempre oscura. Marco de luz alrededor según el estado (D033).
   Izquierda: la cara. Derecha: la conversación. Abajo: accesos rápidos y escritura. */
:root {
  --fondo: #07090d; --panel: #0f141b; --linea: #1d2631;
  --tinta: #e9eff4; --tenue: #7f8c98; --apagado: #3a4654;
  --reposo: #5d6b78; --escucha: #22d3ee; --pensando: #9d6cff; --hablando: #22d3ee;
  --aviso: #ffb020; --error: #ff6b2c; --silencio: #ff3b4f;
  --estado: var(--reposo);
  --letra: "Noto Sans", "DejaVu Sans", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--fondo); color: var(--tinta); font-family: var(--letra); overflow: hidden;
       user-select: none; -webkit-user-select: none; cursor: none; }
body.raton { cursor: default; }

/* Marco de luz: el mismo color que las franjas LED */
#marco { position: fixed; inset: 0; pointer-events: none; z-index: 5; border-radius: 6px;
  box-shadow: inset 0 0 0 3px var(--estado), inset 0 0 38px -6px var(--estado);
  opacity: .9; transition: box-shadow .5s, opacity .5s; }
body[data-estado="reposo"] #marco { opacity: .25; }
body[data-estado="pensando"] #marco, body[data-estado="buscando"] #marco { animation: latido 1.4s ease-in-out infinite; }
@keyframes latido { 50% { opacity: .45; } }

main { position: absolute; inset: 0; display: grid; grid-template-columns: 400px 1fr;
       grid-template-rows: 1fr auto; padding: 22px 26px 18px; gap: 14px 22px; }

/* Cara */
#cara { grid-row: 1; display: grid; place-items: center; }
#cara svg { width: 340px; height: 260px; overflow: visible; }
/* Avatar 3D: sustituye a la cara simple cuando el modelo carga. Fondo original de «puente»:
   ventanal con estrellas, consolas con luz tenue y un halo del color del estado */
#cara { position: relative; }
#escenario { position: absolute; inset: -6px -4px; border-radius: 22px; overflow: hidden; opacity: 0; transition: opacity .8s;
  background:
    radial-gradient(60% 45% at 50% 38%, color-mix(in srgb, var(--estado) 22%, transparent), transparent 70%),
    linear-gradient(180deg, transparent 62%, #0b1622 62.5%, #0e1c2b 76%, #08111a 100%),
    radial-gradient(1px 1px at 12% 18%, #cfe8ff 60%, transparent), radial-gradient(1px 1px at 33% 9%, #cfe8ff 60%, transparent),
    radial-gradient(1.5px 1.5px at 71% 22%, #fff 60%, transparent), radial-gradient(1px 1px at 88% 12%, #cfe8ff 60%, transparent),
    radial-gradient(1px 1px at 57% 31%, #9fc6ff 60%, transparent), radial-gradient(1px 1px at 22% 40%, #9fc6ff 60%, transparent),
    radial-gradient(1px 1px at 92% 44%, #fff 60%, transparent), radial-gradient(1px 1px at 6% 52%, #cfe8ff 60%, transparent),
    linear-gradient(180deg, #050a14, #0a1426 60%); }
#escenario::before { content: ""; position: absolute; left: 0; right: 0; top: 63%; height: 3px;
  background: linear-gradient(90deg, transparent, var(--estado), transparent); opacity: .55; transition: background .5s; }
#escenario::after { content: ""; position: absolute; left: 8%; right: 8%; bottom: 9%; height: 14%;
  background: repeating-linear-gradient(90deg, #13314a 0 18px, transparent 18px 26px); opacity: .5; border-radius: 4px; }
#lienzo3d { position: absolute; inset: -6px -4px; border-radius: 22px; overflow: hidden; }
#lienzo3d canvas { display: block; width: 100%; height: 100%; }
body.con-avatar #escenario { opacity: 1; }
body.con-retrato #escenario { opacity: 0; }   /* el retrato trae su propio fondo */
body.con-retrato #lienzo3d::after { content: ""; position: absolute; inset: 0; border-radius: 22px; pointer-events: none;
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--estado) 55%, transparent),
              inset 0 -46px 50px -34px color-mix(in srgb, var(--estado) 70%, transparent); transition: box-shadow .5s; }
body.con-avatar #cara svg { display: none; }
.ojo { fill: var(--estado); transition: fill .5s; transform-box: fill-box; transform-origin: center;
       animation: parpadeo 5.5s infinite; }
.ojo.der { animation-delay: .04s; }
@keyframes parpadeo { 0%, 94%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(.08); } }
#ojos { transition: transform .6s cubic-bezier(.3,.7,.3,1); }
body[data-estado="pensando"] #ojos, body[data-estado="buscando"] #ojos { transform: translate(14px, -10px); }
body[data-estado="escucha"] .ojo { transform: scale(1.12); animation: none; }
#boca { fill: none; stroke: var(--estado); stroke-width: 9; stroke-linecap: round; transition: stroke .5s; }
#boca-abierta { fill: var(--estado); opacity: 0; transition: fill .5s; transform-box: fill-box; transform-origin: center; }
body[data-estado="hablando"] #boca { opacity: 0; }
body[data-estado="hablando"] #boca-abierta { opacity: 1; animation: hablar .26s ease-in-out infinite alternate; }
@keyframes hablar { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
#puntos circle { fill: var(--estado); opacity: 0; }
body[data-estado="pensando"] #puntos circle, body[data-estado="buscando"] #puntos circle { animation: punto 1.2s infinite; }
#puntos circle:nth-child(2) { animation-delay: .2s !important; } #puntos circle:nth-child(3) { animation-delay: .4s !important; }
@keyframes punto { 0%, 100% { opacity: .15; } 40% { opacity: 1; } }

/* Conversación */
#charla { grid-row: 1; grid-column: 2; display: flex; flex-direction: column; justify-content: center;
          gap: 14px; min-width: 0; padding-right: 6px; }
#cabecera { position: absolute; top: 20px; right: 28px; text-align: right; color: var(--tenue);
            font-size: 15px; line-height: 1.35; font-variant-numeric: tabular-nums; }
#cabecera b { color: var(--tinta); font-size: 26px; font-weight: 600; display: block; letter-spacing: .5px; }
#pregunta { color: var(--tenue); font-size: 18px; min-height: 1.3em; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; }
#respuesta { font-size: 27px; line-height: 1.38; max-height: 350px; overflow-y: auto; scrollbar-width: none;
             text-wrap: pretty; }
#respuesta::-webkit-scrollbar { display: none; }
#respuesta .fuente { color: var(--tenue); }
#estado-txt { font-size: 13px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--estado);
              transition: color .5s; }

/* Barra inferior */
#barra { grid-column: 1 / 3; display: flex; gap: 10px; align-items: center; }
.chip { flex: none; background: var(--panel); color: var(--tinta); border: 1px solid var(--linea);
        border-radius: 22px; padding: 11px 16px; font: 16px var(--letra); }
.chip:active { border-color: var(--estado); }
form { flex: 1; display: flex; gap: 8px; min-width: 0; }
#entrada { flex: 1; min-width: 0; background: var(--panel); color: var(--tinta); border: 1px solid var(--linea);
           border-radius: 22px; padding: 11px 18px; font: 17px var(--letra); outline: none; }
#entrada:focus { border-color: var(--estado); }
#enviar { background: var(--estado); color: var(--fondo); border: 0; border-radius: 22px; padding: 0 20px;
          font: 600 16px var(--letra); transition: background .5s; }
button:focus-visible, .chip:focus-visible { outline: 2px solid var(--estado); outline-offset: 2px; }

/* Barra durante la escritura: sin accesos rápidos y justo encima del teclado */
body.teclado .chip { display: none; }
body.teclado #barra { position: fixed; left: 26px; right: 26px; bottom: calc(var(--alto-teclado) + 12px); z-index: 7; }

/* Teclado en pantalla (el de la propia interfaz: funciona igual en modo quiosco) */
:root { --alto-teclado: 262px; }
#teclado { position: fixed; left: 0; right: 0; bottom: 0; height: var(--alto-teclado); z-index: 7;
  background: #0b1016ee; border-top: 1px solid var(--linea); padding: 10px 12px 12px;
  display: grid; grid-template-rows: repeat(4, 1fr); gap: 8px; transform: translateY(105%); transition: transform .22s ease-out;
  backdrop-filter: blur(6px); }
body.teclado #teclado { transform: none; }
.fila { display: flex; gap: 7px; justify-content: center; }
.tecla { flex: 0 0 89px; background: var(--panel); color: var(--tinta); border: 1px solid var(--linea); border-radius: 10px;
  font: 22px var(--letra); display: grid; place-items: center; touch-action: manipulation; }
.tecla:active, .tecla.pulsada { background: color-mix(in srgb, var(--estado) 35%, var(--panel)); }
.tecla.ancha { flex-basis: 140px; font-size: 17px; }
.tecla.espacio { flex: 1 1 auto; }
.tecla.activa { border-color: var(--estado); color: var(--estado); }
.tecla.enviar { background: var(--estado); color: var(--fondo); font-weight: 600; }

/* Paneles: música y casa */
.panel { position: fixed; z-index: 6; background: var(--fondo); display: none; }
body[data-panel="musica"] #panel-musica, body[data-panel="casa"] #panel-casa { display: flex; }
#panel-musica { left: 448px; right: 26px; top: 84px; bottom: 82px; flex-direction: column; justify-content: center; gap: 18px; }
#panel-musica .tema { display: flex; gap: 22px; align-items: center; }
#portada { width: 190px; height: 190px; border-radius: 14px; background: var(--panel) center / cover; flex: none;
  border: 1px solid var(--linea); display: grid; place-items: center; color: var(--apagado); font-size: 64px; }
#m-nombre { font-size: 28px; font-weight: 600; line-height: 1.2; }
#m-artistas { font-size: 20px; color: var(--tinta); margin-top: 6px; }
#m-album, #m-estado { font-size: 16px; color: var(--tenue); margin-top: 6px; }
#m-barra { height: 5px; border-radius: 3px; background: var(--linea); overflow: hidden; }
#m-barra i { display: block; height: 100%; width: 0; background: var(--estado); transition: width 1s linear; }
#m-ayuda { color: var(--tenue); font-size: 18px; line-height: 1.5; }
#m-mandos { display: none; gap: 12px; align-items: center; }
body.spotify-api #m-mandos { display: flex; }
.mando { width: 64px; height: 56px; border-radius: 16px; background: var(--panel); color: var(--tinta);
  border: 1px solid var(--linea); font: 24px var(--letra); display: grid; place-items: center; }
.mando.grande { width: 84px; background: var(--escucha); color: var(--fondo); border: 0; }
.mando:active { transform: scale(.95); }
#m-vol { color: var(--tenue); font-size: 16px; min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
#m-dispositivo { color: var(--tenue); font-size: 15px; margin-left: auto; }
#panel-casa, #panel-video { inset: 0; flex-direction: column; }
body[data-panel="video"] #panel-video { display: flex; }
#panel-video header { height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--linea); }
#v-titulo { color: var(--tenue); font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#v-marco { flex: 1; background: #000; position: relative; min-height: 0; }
#v-video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
#v-aviso { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--tenue);
  font-size: 18px; pointer-events: none; padding: 30px; }
#v-mandos { height: 62px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-top: 1px solid var(--linea); }
#v-mandos .mando { width: 58px; height: 46px; font-size: 20px; }
#v-mandos .mando.grande { width: 74px; }
#v-barra { flex: 1; height: 30px; display: flex; align-items: center; touch-action: none; }
#v-barra div { width: 100%; height: 6px; border-radius: 3px; background: var(--linea); overflow: hidden; }
#v-barra i { display: block; height: 100%; width: 0; background: var(--escucha); }
#v-tiempo { color: var(--tenue); font-size: 15px; font-variant-numeric: tabular-nums; min-width: 96px; text-align: right; }
#panel-casa header { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--linea); }
#panel-casa header span { color: var(--tenue); font-size: 15px; }
#panel-casa iframe { flex: 1; border: 0; width: 100%; background: var(--panel); }
.cerrar { background: var(--panel); color: var(--tinta); border: 1px solid var(--linea); border-radius: 18px;
  padding: 7px 16px; font: 15px var(--letra); }
.chip.abierto { border-color: var(--escucha); color: var(--escucha); }
#casa-aviso { position: absolute; inset: 46px 0 0; display: grid; place-content: center; text-align: center; gap: 12px;
  padding: 40px; color: var(--tenue); font-size: 18px; line-height: 1.5; background: var(--fondo); }
#casa-aviso b { color: var(--tinta); font-size: 22px; font-weight: 600; }
#casa-aviso code { color: var(--tinta); background: var(--panel); padding: 2px 8px; border-radius: 6px; font-size: 16px; }
#panel-casa { position: fixed; }

/* Pantalla de reposo: tras un rato sin uso, reloj grande */
#reposo { position: absolute; inset: 0; display: none; place-content: center; text-align: center; gap: 6px;
          background: var(--fondo); z-index: 3; font-variant-numeric: tabular-nums; }
#reposo .hora { font-size: 150px; font-weight: 300; letter-spacing: 2px; line-height: 1; }
#reposo .fecha { font-size: 26px; color: var(--tenue); }
#reposo .clima { font-size: 20px; color: var(--tenue); max-width: 760px; margin: 14px auto 0; }
body.dormido #reposo { display: grid; }

#arranque { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; z-index: 4;
            background: var(--fondo); color: var(--tenue); font-size: 20px; gap: 10px; }
#arranque b { color: var(--tinta); font-size: 34px; font-weight: 500; letter-spacing: 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

               "@pixiv/three-vrm": "./lib/three-vrm.module.js" } }

<script type="module">
// Avatar 3D. Si no hay WebGL o el modelo no carga, se queda la cara simple.
// Retrato ilustrado animado (2,5D) o personaje 3D (VRM), según lo que haya en ~/.config/prisma
fetch("/api/avatar").then(r => r.json()).catch(() => ({ tipo: "retrato" })).then(({ tipo }) =>
  import(tipo === "vrm" ? "./avatar.js" : "./retrato.js").then(m => m.inicia()).then(() => tipo)
).then(tipo => {
  document.body.classList.add("con-avatar", "con-" + tipo);
  window.avatar.estado(document.body.dataset.estado);
}).catch(e => console.warn("Avatar no disponible:", e));
</script>
<script>
const $ = s => document.querySelector(s);
const ETIQUETA = { reposo: "Prisma", escucha: "Te escucho", pensando: "Pensando", buscando: "Buscando",
                   hablando: "Prisma", aviso: "Aviso", error: "Algo ha fallado" };
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const REPOSO_TRAS = 90_000;      // ms sin usarlo hasta la pantalla de reposo
let ocupado = false, ultimoUso = Date.now(), finHablar = 0, ha = "";

function pon(estado) {
  document.body.dataset.estado = estado;
  const c = getComputedStyle(document.documentElement).getPropertyValue("--" + (estado === "buscando" ? "pensando" : estado));
  document.documentElement.style.setProperty("--estado", c.trim() || "var(--reposo)");
  $("#estado-txt").textContent = ETIQUETA[estado] || "Prisma";
  window.avatar && window.avatar.estado(estado);
}

function despierta() {
  ultimoUso = Date.now();
  document.body.classList.remove("dormido");
}

function reloj() {
  const d = new Date(), hm = d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  const f = `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
  $("#reloj").textContent = hm; $("#fecha").textContent = f;
  $("#reposo-hora").textContent = hm; $("#reposo-fecha").textContent = f;
  const viendo = document.body.dataset.panel === "video";          // con un vídeo puesto no se duerme
  if (!ocupado && !viendo && Date.now() - ultimoUso > REPOSO_TRAS && !document.body.classList.contains("dormido")) {
    document.body.classList.add("dormido"); finHablar = 0; pon("reposo"); panel(null); teclado(false);
  }
  if (!ocupado && finHablar && Date.now() > finHablar) { finHablar = 0; pon("reposo"); }
}

async function clima() {
  try { const r = await (await fetch("/api/tiempo")).json(); if (r.texto) $("#reposo-clima").textContent = r.texto; }
  catch (e) { /* sin red: el reposo enseña solo la hora */ }
}

function escribe(texto) {
  const r = $("#respuesta");
  const m = texto.match(/^(Según [^:]{2,60}:)(.*)$/s);        // la fuente en gris
  if (m) { const s = document.createElement("span"); s.className = "fuente"; s.textContent = m[1];
           r.append(s, document.createTextNode(m[2] + " ")); }
  else r.append(document.createTextNode(texto + " "));
  r.scrollTop = r.scrollHeight;
  // sin voz todavía: «habla» el tiempo que tardaría en leerse (≈15 caracteres por segundo)
  finHablar = Math.max(finHablar, Date.now()) + Math.max(900, texto.length * 66);
}

async function pregunta(texto) {
  texto = texto.trim();
  if (!texto || ocupado) return;
  despierta(); ocupado = true; finHablar = 0; teclado(false); $("#entrada").blur();
  $("#pregunta").textContent = texto; $("#respuesta").textContent = ""; $("#entrada").value = "";
  pon("pensando");
  try {
    const resp = await fetch("/api/preguntar", { method: "POST", headers: { "Content-Type": "application/json" },
                                                 body: JSON.stringify({ texto }) });
    const lector = resp.body.getReader(), dec = new TextDecoder();
    let buf = "", buscando = false;
    for (;;) {
      const { value, done } = await lector.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const linea = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!linea.startsWith("data: ")) continue;
        const ev = JSON.parse(linea.slice(6));
        if (ev.tipo === "estado") { pon(ev.estado); buscando = ev.estado === "buscando"; }
        else if (ev.tipo === "video") { if (ev.cerrar) panel(null); else videos(ev.lista); }
        else if (ev.tipo === "trozo") {
          if (buscando && ev.texto === "Lo busco…") { $("#respuesta").textContent = "Lo busco…"; continue; }
          if ($("#respuesta").textContent === "Lo busco…") $("#respuesta").textContent = "";
          escribe(ev.texto);
        } else if (ev.tipo === "fin" && ev.texto) { pon("error"); escribe(ev.texto); }
        else if (ev.tipo === "fin" && ev.accion === "musica" && !document.body.dataset.panel)
          setTimeout(() => { if (!ocupado) panel("musica"); }, 2200);     // tras «Pongo…», enseña lo que suena
      }
    }
  } catch (e) {
    pon("error"); $("#respuesta").textContent = "No consigo hablar con mi cerebro. ¿Está en marcha el servidor?";
    finHablar = Date.now() + 4000;
  } finally {
    ocupado = false; ultimoUso = Date.now();
    if (!finHablar) finHablar = Date.now() + 1500;
  }
}

async function espera() {
  for (;;) {
    try {
      const e = await (await fetch("/api/estado")).json();
      if (e.listo) {
        $("#arranque").remove();
        if (e.nombre) $("#respuesta").textContent = `Hola, ${e.nombre}. Pregúntame la hora, el tiempo o las noticias, pon música o charla conmigo.`;
        ha = e.home_assistant || "";
        return;
      }
      $("#arranque-txt").textContent = "Cargando el modelo de lenguaje…";
    } catch (e) { $("#arranque-txt").textContent = "Esperando al servidor…"; }
    await new Promise(r => setTimeout(r, 1500));
  }
}

document.querySelectorAll(".chip[data-pide]").forEach(b => b.addEventListener("click", () => { panel(null); pregunta(b.dataset.pide); }));
document.querySelectorAll(".chip[data-panel]").forEach(b => b.addEventListener("click", () =>
  panel(document.body.dataset.panel === b.dataset.panel ? null : b.dataset.panel)));
document.querySelectorAll("[data-cierra]").forEach(b => b.addEventListener("click", () => panel(null)));
$("#formulario").addEventListener("submit", e => { e.preventDefault(); pregunta($("#entrada").value); });
["pointerdown", "keydown"].forEach(t => addEventListener(t, despierta));
addEventListener("mousemove", () => document.body.classList.add("raton"), { once: true });
$("#entrada").addEventListener("focus", () => { if (!ocupado && !finHablar) pon("escucha"); teclado(true); });
$("#entrada").addEventListener("blur", () => { if (!ocupado && !finHablar) pon("reposo"); });
// Tocar fuera del teclado y de la barra lo esconde
addEventListener("pointerdown", e => {
  // (una tecla puede haber redibujado el teclado: su botón ya no está en la página)
  if (document.body.classList.contains("teclado") && e.target.isConnected && !e.target.closest("#teclado, #barra")) { teclado(false); $("#entrada").blur(); }
});


// ---------- Paneles: música (Spotify Connect) y casa (Home Assistant) ----------
let sondeoMusica = 0;
function panel(nombre) {
  if (nombre) document.body.dataset.panel = nombre; else delete document.body.dataset.panel;
  document.querySelectorAll(".chip[data-panel]").forEach(b => b.classList.toggle("abierto", b.dataset.panel === nombre));
  clearInterval(sondeoMusica);
  if (nombre === "musica") { musica(); sondeoMusica = setInterval(musica, 2000); }
  if (nombre === "casa") casa();
  if (nombre !== "video") { const v = $("#v-video"); v.pause(); v.removeAttribute("src"); v.load(); }
  if (nombre) teclado(false);
}

// Home Assistant se carga una vez y se queda abierto; antes se comprueba que responde y que deja mostrarse aquí
async function casa() {
  if ($("#ha").src) return;
  const aviso = $("#casa-aviso"); aviso.style.display = ""; aviso.textContent = "Conectando con Home Assistant…";
  let c = {};
  try { c = await (await fetch("/api/casa")).json(); } catch (e) { c = { motivo: "no_responde" }; }
  if (c.ok) { $("#ha").src = c.url; aviso.style.display = "none"; return; }
  aviso.innerHTML = c.motivo === "marcos"
    ? "<b>Home Assistant no deja mostrarse dentro de Prisma</b><span>Añade esto a <code>configuration.yaml</code> de Home Assistant y reinícialo:</span><code>http:<br>&nbsp;&nbsp;use_x_frame_options: false</code>"
    : `<b>No encuentro Home Assistant</b><span>Probé <code>${(c.url || "sin dirección").replace(/[<>&]/g, "")}</code>. Pon la dirección correcta en <code>~/.config/prisma/nucleo.json</code>:</span><code>"home_assistant": "http://192.168.1.X:8123"</code>`;
}

let ultimaMusica = {};
document.querySelectorAll(".mando").forEach(b => b.addEventListener("click", async () => {
  let accion = b.dataset.accion;
  if (accion === "play" && ultimaMusica.estado === "sonando") accion = "pause";
  try {
    await fetch("/api/musica/accion", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ accion, valor: b.dataset.valor ? Number(b.dataset.valor) : null }) });
  } catch (e) { /* sin servidor */ }
  setTimeout(musica, 350);
}));

// ---------- YouTube: el vídeo llega directo (yt-dlp en la Pi) a un reproductor propio ----------
// Sin el reproductor de YouTube: no hay «Vídeo no disponible», ni enlaces que saquen de Prisma.
let listaVideos = [], videoActual = 0, pidiendo = 0;
const vid = $("#v-video");
async function videos(lista) {
  listaVideos = lista || []; videoActual = 0;
  if (listaVideos.length) { panel("video"); ponVideo(); }
}
async function ponVideo() {
  const v = listaVideos[videoActual], yo = ++pidiendo;
  vid.pause(); vid.removeAttribute("src"); vid.load();
  if (!v) { $("#v-aviso").textContent = "No he podido abrir ninguno de estos vídeos."; return; }
  $("#v-titulo").textContent = v.titulo + (v.canal ? " · " + v.canal : "");
  $("#v-aviso").textContent = "Preparando el vídeo…";
  $("#v-otro").style.visibility = videoActual < listaVideos.length - 1 ? "" : "hidden";
  let r = {};
  try { r = await (await fetch("/api/video?id=" + encodeURIComponent(v.id))).json(); } catch (e) { r = {}; }
  if (yo !== pidiendo) return;                       // mientras tanto se pidió otro
  if (!r.url) { videoActual++; return ponVideo(); }  // este no se puede: el siguiente
  vid.src = r.url;
  vid.play().catch(() => {});
}
vid.addEventListener("playing", () => { $("#v-aviso").textContent = ""; $("#v-play").textContent = "⏸"; });
vid.addEventListener("pause", () => { $("#v-play").textContent = "▶"; });
vid.addEventListener("error", () => { if (vid.getAttribute("src")) { videoActual++; ponVideo(); } });
vid.addEventListener("ended", () => setTimeout(() => { if (document.body.dataset.panel === "video") panel(null); }, 1500));
vid.addEventListener("timeupdate", () => {
  const d = vid.duration || 0, t = vid.currentTime || 0;
  $("#v-barra i").style.width = d ? (100 * t / d) + "%" : "0";
  $("#v-tiempo").textContent = d ? `${mmss(t * 1000)} / ${mmss(d * 1000)}` : "";
});
$("#v-play").addEventListener("click", () => vid.paused ? vid.play() : vid.pause());
vid.addEventListener("click", () => vid.paused ? vid.play() : vid.pause());
document.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => {
  vid.currentTime = Math.max(0, Math.min((vid.duration || 0) - 1, vid.currentTime + Number(b.dataset.v)));
}));
$("#v-barra").addEventListener("pointerdown", e => {
  const r = e.currentTarget.getBoundingClientRect();
  if (vid.duration) vid.currentTime = vid.duration * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
});
$("#v-otro").addEventListener("click", () => { videoActual++; ponVideo(); });

const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
async function musica() {
  let m = {};
  try { m = await (await fetch("/api/musica")).json(); } catch (e) { /* servidor reiniciando */ }
  const hay = m.nombre && (m.estado === "sonando" || m.estado === "pausa" || m.estado === "parada");
  $("#panel-musica .tema").style.display = hay ? "" : "none";
  $("#m-barra").style.display = hay && m.duracion_ms ? "" : "none";
  if (hay) {
    $("#portada").style.backgroundImage = m.portada ? `url("${m.portada}")` : "";
    $("#portada").textContent = m.portada ? "" : "♪";
    $("#m-nombre").textContent = m.nombre; $("#m-artistas").textContent = m.artistas || "";
    $("#m-album").textContent = m.album || "";
    $("#m-estado").textContent = { sonando: "Sonando", pausa: "En pausa", parada: "Parada" }[m.estado] +
      (m.duracion_ms ? ` · ${mmss(m.posicion_ms)} / ${mmss(m.duracion_ms)}` : "");
    $("#m-barra i").style.width = m.duracion_ms ? Math.min(100, 100 * m.posicion_ms / m.duracion_ms) + "%" : "0";
  }
  document.body.classList.toggle("spotify-api", !!m.api);
  ultimaMusica = m;
  $("#m-play").textContent = m.estado === "sonando" ? "⏸" : "▶";
  $("#m-vol").textContent = m.volumen != null ? m.volumen + " %" : "";
  $("#m-dispositivo").textContent = m.dispositivo ? "en " + m.dispositivo : "";
  $("#m-ayuda").textContent = m.api ? (hay ? "Di o escribe «pon …» con un artista, una canción, un disco o una lista."
      : "No suena nada. Di o escribe «pon …» con un artista, una canción, un disco o una lista.")
    : hay ? "Controla la música desde Spotify en el móvil o el ordenador."
    : m.estado === "conectado" ? "Conectado a Spotify. Elige una canción en la app y sonará aquí."
    : "Para escuchar música: abre Spotify en el móvil, pulsa el icono del altavoz y elige «Prisma».";
}

// ---------- Teclado en pantalla ----------
const LETRAS = [["q","w","e","r","t","y","u","i","o","p"], ["a","s","d","f","g","h","j","k","l","ñ"],
                ["⇧","z","x","c","v","b","n","m","⌫"], ["123","´","espacio","¿?","Enviar","⌄"]];
const SIGNOS = [["1","2","3","4","5","6","7","8","9","0"], ["-","/",":",";","(",")","€","&","@","\""],
                ["#+=",".",",","?","!","'","%","+","⌫"], ["abc","´","espacio","¿?","Enviar","⌄"]];
const ACENTO = { a: "á", e: "é", i: "í", o: "ó", u: "ú", A: "Á", E: "É", I: "Í", O: "Ó", U: "Ú" };
let mayus = false, signos = false, tilde = false, borrando = 0;

function pintaTeclado() {
  const t = $("#teclado"); t.textContent = "";
  for (const fila of (signos ? SIGNOS : LETRAS)) {
    const f = document.createElement("div"); f.className = "fila";
    for (const k of fila) {
      const b = document.createElement("button"); b.type = "button"; b.className = "tecla"; b.dataset.k = k;
      b.textContent = k === "espacio" ? "" : (!signos && mayus && k.length === 1 ? k.toUpperCase() : k);
      if (["⇧", "⌫", "123", "abc", "#+=", "¿?", "⌄", "´"].includes(k)) b.classList.add("ancha");
      if (k === "espacio") b.classList.add("espacio");
      if (k === "Enviar") b.classList.add("ancha", "enviar");
      if ((k === "⇧" && mayus) || (k === "´" && tilde)) b.classList.add("activa");
      f.append(b);
    }
    t.append(f);
  }
}

function escribeTecla(k) {
  const e = $("#entrada");
  if (k === "⌫") e.value = e.value.slice(0, -1);
  else if (k === "⇧") { mayus = !mayus; pintaTeclado(); }
  else if (k === "123" || k === "abc" || k === "#+=") { signos = k !== "abc"; pintaTeclado(); }
  else if (k === "´") { tilde = !tilde; pintaTeclado(); }
  else if (k === "¿?") e.value += e.value.includes("¿") && !e.value.endsWith("?") ? "?" : "¿";
  else if (k === "espacio") e.value += " ";
  else if (k === "Enviar") pregunta(e.value);
  else if (k === "⌄") { teclado(false); e.blur(); }
  else {
    let c = !signos && mayus ? k.toUpperCase() : k;
    if (tilde) { c = ACENTO[c] || c; tilde = false; pintaTeclado(); }
    e.value += c;
    if (mayus) { mayus = false; pintaTeclado(); }          // mayúscula solo para la siguiente letra
  }
}

function teclado(abre) {
  document.body.classList.toggle("teclado", abre);
  if (abre) { mayus = $("#entrada").value === ""; signos = false; tilde = false; pintaTeclado(); despierta(); }
}

// Las teclas no quitan el foco a la caja de texto; ⌫ mantenido borra seguido
$("#teclado").addEventListener("pointerdown", e => {
  const b = e.target.closest(".tecla"); if (!b) return;
  e.preventDefault(); b.classList.add("pulsada"); despierta();
  escribeTecla(b.dataset.k);
  if (b.dataset.k === "⌫") borrando = setTimeout(function repite() { escribeTecla("⌫"); borrando = setTimeout(repite, 80); }, 450);
});
["pointerup", "pointercancel", "pointerleave"].forEach(t => $("#teclado").addEventListener(t, () => {
  clearTimeout(borrando); document.querySelectorAll(".tecla.pulsada").forEach(b => b.classList.remove("pulsada"));
}));
$("#entrada").addEventListener("pointerdown", () => teclado(true));

pon("reposo"); reloj(); clima(); espera();
setInterval(reloj, 1000); setInterval(clima, 15 * 60_000);
</script>
