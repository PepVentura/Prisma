# SearXNG para Prisma: solo uso local, respuestas en JSON y en español.
use_default_settings: true
general:
  instance_name: "Prisma"
server:
  secret_key: "CAMBIAR_CLAVE"
  limiter: false
  image_proxy: false
search:
  safe_search: 1
  default_lang: "es-ES"
  formats:
    - html
    - json
outgoing:
  request_timeout: 1.5        # cada buscador tiene 1,5 s para responder (Prisma no espera más)
  max_request_timeout: 3.0
